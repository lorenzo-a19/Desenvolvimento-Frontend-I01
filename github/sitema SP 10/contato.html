<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Santa Pimenta</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <div class="marca">
                <img src="imagem/capa/logo-santa-pimenta.png" alt="Logo Santa Pimenta">
                <h1>Santa Pimenta</h1>
            </div>

            <nav class="menu">
                <a href="index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="produtos.html">Produtos</a>
                <a href="contato.html">Contato</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="contato">
            <div class="container contato-conteudo">
                <article class="contato-info">
                    <p class="etiqueta">Contato</p>
                    <h2>Fale com a Santa Pimenta</h2>

                    <p>Entre em contato para saber mais sobre compras no atacado.</p>

                    <ul>
                        <li><strong>Telefone:</strong> (27) 99964-6821</li>
                        <li><strong>Email:</strong> contato@santapimenta.com</li>
                        <li><strong>Cidade:</strong> Colatina - ES</li>
                    </ul>
                </article>

                <form class="formulario">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" required>

                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

                    <button type="submit">Enviar mensagem</button>
                </form>
            </div>
        </section>

        <section class="mapa">
            <div class="container">
                <h2>Localização</h2>

                <iframe src="https://www.google.com/maps?q=Colatina%20ES&output=embed" width="100%" height="300"
                    style="border:0;" loading="lazy">
                </iframe>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Santa Pimenta Atacado.</p>
    </footer>

</body>

</html>
